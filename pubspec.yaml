name: nextflow
description: "Nextcloud Open Client"
publish_to: 'none'
version: 0.2.5+8

environment:
  sdk: ^3.10.8

dependencies:
  dio: ^5.9.0
  file_picker: ^10.3.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.0
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  markdown_widget: ^2.3.2+8
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  printing: ^5.14.2
  url_launcher: ^6.3.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/files/
